name: Orbito Platform CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

      - name: Monorepo Linting
        run: npm run lint

      - name: Build Shared Types & Packages
        run: npm run build:types

      - name: Build Backend (NestJS)
        run: npm run build:backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

      - name: Build Frontend (Next.js 16 Standalone)
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000/api"
          NEXT_PUBLIC_SOCKET_URL: "http://localhost:3000"

  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend.prod
          push: false
          tags: orbito/backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend.prod
          push: false
          tags: orbito/frontend:test
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3000/api
            NEXT_PUBLIC_SOCKET_URL=http://localhost:3000

