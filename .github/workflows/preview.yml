name: Orbito Preview & PR Validation

on:
  pull_request:
    branches: [ master, main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: PR Quality Gates & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

      - name: Run Monorepo Linter
        run: npm run lint

      - name: Compile Shared Types
        run: npm run build:types

  preview-build-and-test:
    name: Preview Build & Database Migration Probe
    runs-on: ubuntu-latest
    needs: pr-validation

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_orbito
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Prisma Migrations on Clean Postgres
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_orbito?schema=public"

      - name: Build Backend (NestJS)
        run: npm run build:backend
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_orbito?schema=public"

      - name: Build Frontend Standalone (Next.js 16)
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000/api"
          NEXT_PUBLIC_SOCKET_URL: "http://localhost:3000"

      - name: Run Production Pre-Flight Audit
        run: npm run preflight
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_orbito?schema=public"
          SKIP_REDIS_CHECK: "false"

      - name: Publish Step Summary
        run: |
          echo "### 🚀 Orbito PR Preview Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ All Quality Gates Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Prisma Migrations:** Cleanly applied on PostgreSQL 16" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Build:** NestJS production artifact generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Standalone:** Next.js standalone bundle compiled successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-flight Audit:** Zero failures reported" >> $GITHUB_STEP_SUMMARY
