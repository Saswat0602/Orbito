# =============================================================================
# Orbito Enterprise Platform - Production Docker Compose Orchestration
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orbito-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbito_secure_password_replace_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-orbito}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbito} -d ${POSTGRES_DB:-orbito}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orbito-prod-network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # ---------------------------------------------------------------------------
  # 2. Redis Key-Value Store & BullMQ Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orbito-prod-redis
    restart: always
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
          else
            redis-cli ping | grep PONG
          fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orbito-prod-network
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ---------------------------------------------------------------------------
  # 3. Database Migration Runner (Zero-Downtime Schema Sync)
  # ---------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.prod
    container_name: orbito-prod-migration
    command: >
      sh -c "
        echo '⏳ Waiting for PostgreSQL...' &&
        until nc -z postgres 5432; do sleep 2; done &&
        echo '🗄️ Applying Prisma database migrations...' &&
        npx prisma migrate deploy --schema=backend/prisma/schema.prisma &&
        echo '✅ Migrations applied successfully!'
      "
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orbito:orbito_secure_password_replace_in_prod@postgres:5432/orbito?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbito-prod-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # 4. Backend REST API & Real-time WebSockets Gateway (NestJS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.prod
    container_name: orbito-prod-backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://orbito:orbito_secure_password_replace_in_prod@postgres:5432/orbito?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      UPLOAD_DEST: /app/backend/uploads
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    networks:
      - orbito-prod-network

  # ---------------------------------------------------------------------------
  # 5. Frontend Web Application (Next.js 16 Standalone)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
    container_name: orbito-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - orbito-prod-network

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_prod_data:
    name: orbito_postgres_prod_data
  redis_prod_data:
    name: orbito_redis_prod_data
  backend_uploads:
    name: orbito_backend_uploads

# -----------------------------------------------------------------------------
# Network Definition
# -----------------------------------------------------------------------------
networks:
  orbito-prod-network:
    name: orbito_prod_network
    driver: bridge

