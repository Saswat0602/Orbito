<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <defs>
    <linearGradient id="orbito-orbit-back" x1="12" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="orbito-orbit-front" x1="12" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <radialGradient id="orbito-core" cx="32" cy="32" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </radialGradient>
    <radialGradient id="orbito-glow" cx="32" cy="32" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="18" fill="url(#orbito-glow)" />
  <!-- Back Orbital Arc -->
  <path d="M 52.5 21.5 C 50.5 13.5 35 15.5 20.5 25.5 C 15.5 29 12 33 11.5 37" stroke="url(#orbito-orbit-back)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Central Sphere Core -->
  <circle cx="32" cy="32" r="9.5" fill="url(#orbito-core)" stroke="#ffffff" stroke-width="1" />
  <!-- Front Orbital Arc -->
  <path d="M 11.5 37 C 13.5 45 29 43 43.5 33 C 48.5 29.5 52 25.5 52.5 21.5" stroke="url(#orbito-orbit-front)" stroke-width="3.5" stroke-linecap="round" />
</svg>

