run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - gosec
    - misspell
    - unconvert
    - revive

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G101 # Ignore false positives on hardcoded credentials in tests
      - G104 # Errors unhandled (checked by errcheck)
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-dirs:
    - bin
    - tmp
    - vendor
  exclude-use-default: false
